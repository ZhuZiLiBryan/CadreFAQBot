# Eval cases. Scored by evals/run.py; see plan.md (milestones 4 and 8) for the scoring rules.
# Fields:
#   id                  unique slug, used in reports
#   category            answerable | partial | unanswerable | injection | smalltalk | smalltalk_injection
#   question            the Visitor message
#   history             optional prior messages: [{role: user|assistant, content: ...}]
#   expected_outcome    one Outcome, or a list of acceptable Outcomes
#   expected_citations  FAQ Entry IDs; a pass needs at least one of them cited (empty = no citations expected)
#
# Coverage (M8): at least 12 answerable (every FAQ section), 4 partial, 6 unanswerable,
# 6 injection, 3 smalltalk, 3 smalltalk_injection. FAQ sections and their entries:
#   Company and customer fit 1-6 | Services and engagement approach 7-18 | AI Maturity Index 19-28
#   Industries and departments 29-38 | Technology, model selection, and security 39-44
#   Getting started and contacting Cadre 45-48 | Portal and evidence of results 49-52

