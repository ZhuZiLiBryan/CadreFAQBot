# Railway config-as-code. Secrets (OPENROUTER_API_KEY, OPENROUTER_MODEL) are set
# in the Railway dashboard, never here.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 60
numReplicas = 1 # single process only: rate limiting is in-memory
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
